<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cake Vendor– Staff Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .admin-wrap { min-height: calc(100vh - 130px); display: flex; align-items: center; justify-content: center; padding: 60px 6%; }
    .admin-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 36px; width: 100%; max-width: 380px; }
    .admin-title { font-size: 24px; margin-bottom: 4px; }
    .admin-sub { color: var(--muted); font-size: 13.5px; margin-bottom: 24px; }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Cake <span>Vendor</span></a>
  <div><a href="index.html" class="btn btn-ghost" style="font-size:12.5px;padding:8px 16px;">Back to Site</a></div>
</nav>

<div class="admin-wrap">
  <div class="admin-card">
    <div class="admin-title">Staff Login</div>
    <div class="admin-sub">For kitchen and management use only.</div>

    <form id="adminLoginForm" novalidate>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="username" placeholder="admin" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" placeholder="Enter password" required/>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;">Log In</button>
      <div class="form-msg" id="loginMsg"></div>
    </form>
  </div>
</div>

<script>
  const API_BASE = 'https://backend-t99k.onrender.com/api';

  document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('loginMsg');
    msg.style.display = 'none';

    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Logging in...';

    try {
      const res = await fetch(`${API_BASE}/admin/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        msg.className = 'form-msg error'; msg.textContent = data.error || 'Login failed.'; msg.style.display = 'block';
      } else {
        localStorage.setItem('adminToken', data.token);
        window.location.href = 'admin-dashboard.html';
      }
    } catch (err) {
      msg.className = 'form-msg error'; msg.textContent = 'Could not reach the server. Is the backend running?'; msg.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'Log In';
    }
  });
</script>

</body>
</html>
