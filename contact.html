<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Baker NG – Contact</title>
  <meta name="description" content="Get in touch with The Baker NG — call, WhatsApp, or find us on Instagram and TikTok."/>
  <link rel="canonical" href="https://thebakerng.netlify.app/contact"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .contact-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.04);
    }
    .contact-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .contact-btn:hover { transform: translateY(-1px); }
    .contact-btn .icon-circle {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .contact-btn.call {
      background: var(--primary, #b5651d);
      color: #fff;
    }
    .contact-btn.call .icon-circle { background: rgba(255,255,255,0.22); }

    .contact-btn.whatsapp {
      background: #25D366;
      color: #fff;
    }
    .contact-btn.whatsapp .icon-circle { background: rgba(255,255,255,0.22); }

    .social-row {
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }
    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--cream-dark, #f6efe6);
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .social-btn:hover { transform: translateY(-1px); background: var(--border); }
    .social-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .contact-divider {
      text-align: center;
      font-size: 11.5px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 6px 0 -2px;
    }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">The Baker <span>NG</span></a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html" onclick="sessionStorage.setItem('scrollToMenu','1')">Menu</a></li>
    <li><a href="track.html">Track Order</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="about.html">About Us</a></li>
  </ul>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<section class="section" style="padding:60px 6% 40px;max-width:600px;margin:0 auto;">

  <p style="text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px;">Call, WhatsApp, or find us on social — we'd love to hear from you.</p>

  <div class="contact-card">

    <div class="contact-divider">Follow us</div>

    <div class="social-row">

        <!-- Instagram icon -->

          <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.7"/>

        @thebaker.ng24
      </a>
    </div>

  </div>
</section>

<footer>
  &copy; 2026 The Baker NG. Made fresh, ordered easy.
</footer>

<script>
  document.getElementById('navToggle').addEventListener('click', function () {
    document.getElementById('navLinks').classList.toggle('open');
    document.getElementById('navToggle').classList.toggle('open');
  });
  document.querySelectorAll('.nav-links a').forEach(function (a) {
    a.addEventListener('click', function () {
      document.getElementById('navLinks').classList.remove('open');
      document.getElementById('navToggle').classList.remove('open');
    });
  });
</script>
</body>
</html>
